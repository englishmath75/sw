name: Read-only SW Pages diagnostics
on:
  push:
    branches: [work/sw-integrated-release-20261107]
    paths: [.github/workflows/pages-diagnostics.yml]
permissions:
  contents: read
  actions: read
  pages: read
  deployments: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read hosting status without changing deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('node:fs');
            const base = {owner: 'englishmath75', repo: 'sw', request: {timeout: 20000}};
            const out = {checkedAt: new Date().toISOString(), readOnly: true};
            const read = async (route, params = {}) => {
              try { return (await github.request(route, {...base, ...params})).data; }
              catch (e) { return {httpStatus: e.status, message: e.message.split('\n')[0]}; }
            };
            const pick = (v, keys) => Object.fromEntries(keys.filter(k => v[k] !== undefined).map(k => [k, v[k]]));
            const site = await read('GET /repos/{owner}/{repo}/pages');
            out.site = pick(site, ['status', 'cname', 'https_enforced', 'build_type', 'html_url', 'httpStatus', 'message']);
            const progress = await read('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {deployment_id: 'a45fc90fb6cbc132248a27b88f9c09557d1c676b'});
            out.pagesDeployment = pick(progress, ['status', 'error', 'httpStatus', 'message']);
            const deployments = await read('GET /repos/{owner}/{repo}/deployments', {environment: 'github-pages', per_page: 3});
            out.deployments = [];
            if (Array.isArray(deployments)) for (const d of deployments) {
              const statuses = await read('GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses', {deployment_id: d.id, per_page: 3});
              out.deployments.push({id: d.id, sha: d.sha, statuses: Array.isArray(statuses) ? statuses.map(s => pick(s, ['state', 'description', 'created_at', 'log_url', 'environment_url'])) : statuses});
            }
            fs.mkdirSync('diagnostics', {recursive: true});
            fs.writeFileSync('diagnostics/pages-status.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-pages-read-only-status
          path: diagnostics/
          retention-days: 30
