name: Read-only public lesson video check
on:
  push:
    branches: [work/sw-integrated-release-20261107]
    paths: [.github/workflows/video-public-check.yml, scripts/verify-video-delivery.mjs]
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser check dependency
        run: |
          npm init -y
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Check existing public lesson video
        env:
          SOURCE_SHA: 5825ef05bd712b796ab2819ef0134baf5cfb639a
          SW_VIDEO_BROWSER: ${{ matrix.browser }}
          VERIFICATION_DIR: verification
        run: node scripts/verify-video-delivery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-video-${{ matrix.browser }}
          path: verification/
          retention-days: 30
